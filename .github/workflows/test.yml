name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npm install
      - run: npm test
      # extension.js is what Canvas installs, so it must match src/.
      - name: Check extension.js is built from src/
        run: git diff --exit-code extension.js
