name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npm install
      - run: npm test
      - name: Check extension.js is built from src/
        run: git diff --exit-code extension.js
      # Tag and release canvas-extension.json's version, once.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version canvas-extension.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
          fi
